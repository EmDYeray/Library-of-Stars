name: Starry Library for iOS 18

on:
  workflow_dispatch:
  push:
    branches: [ios-18]

permissions:
  contents: read

jobs:
  ipad:
    runs-on: macos-15
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: iphoneos
            triplet: arm64-ios
            arch: arm64
          - sdk: iphonesimulator
            triplet: x64-ios-simulator
            arch: x86_64
    env:
      VCPKG_REVISION: 74e6536215718009aae747d86d84b78376bf9e09
      VCPKG_TRIPLET: ${{ matrix.triplet }}
      APPLE_SDK: ${{ matrix.sdk }}
      BUNDLE_ID: org.cuentosentreestrellas.biblioteca
    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode and OpenGL ES SDK
        id: sdk
        run: |
          test -d /Applications/Xcode_16.4.app
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          version="$(xcrun --sdk "$APPLE_SDK" --show-sdk-version)"
          echo "SDK $APPLE_SDK: $version"
          [[ "$version" == 18.* ]]
          test -d "$(xcrun --sdk "$APPLE_SDK" --show-sdk-path)/System/Library/Frameworks/OpenGLES.framework"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          command -v pkg-config >/dev/null || brew install pkgconf
          mkdir -p "$RUNNER_TEMP/starry-vcpkg-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/starry-vcpkg-cache" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ios18-cairo-xcode16.4-${{ env.VCPKG_REVISION }}-${{ matrix.triplet }}-${{ steps.sdk.outputs.version }}-${{ hashFiles('ios/vcpkg.json') }}

      - name: Build Cairo and FreeType for iPad
        run: |
          vcpkg="$RUNNER_TEMP/vcpkg"
          git init "$vcpkg"
          git -C "$vcpkg" fetch --depth=1 https://github.com/microsoft/vcpkg.git "$VCPKG_REVISION"
          git -C "$vcpkg" checkout --detach FETCH_HEAD
          "$vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          "$vcpkg/vcpkg" install --triplet "$VCPKG_TRIPLET" --host-triplet x64-osx \
            --overlay-triplets="$GITHUB_WORKSPACE/ios/triplets" \
            --x-manifest-root="$GITHUB_WORKSPACE/ios" \
            --x-install-root="$RUNNER_TEMP/starry-deps"

      - name: Build Starry Library
        run: |
          unset PKG_CONFIG_PATH
          deps="$RUNNER_TEMP/starry-deps/$VCPKG_TRIPLET"
          export PKG_CONFIG_LIBDIR="$deps/lib/pkgconfig:$deps/share/pkgconfig"
          cmake -S . -B build-ios18 -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT="$APPLE_SDK" \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          cmake --build build-ios18 --config Release --target StarryLibrary
          app="$GITHUB_WORKSPACE/build-ios18/Release-$APPLE_SDK/StarryLibrary.app"
          test -x "$app/StarryLibrary"
          cmake -E copy_directory assets "$app/assets"
          echo "APP=$app" >> "$GITHUB_ENV"

      - name: Verify and package device IPA
        if: matrix.sdk == 'iphoneos'
        run: |
          set -eo pipefail
          plutil -lint "$APP/Info.plist"
          test "$(plutil -extract CFBundleExecutable raw -o - "$APP/Info.plist")" = StarryLibrary
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract UIDeviceFamily.0 raw -o - "$APP/Info.plist")" = 1
          test "$(plutil -extract UIDeviceFamily.1 raw -o - "$APP/Info.plist")" = 2
          test "$(plutil -extract MinimumOSVersion raw -o - "$APP/Info.plist")" = 18.0
          scene_key=UIApplicationSceneManifest.UISceneConfigurations.UIWindowSceneSessionRoleApplication.0.UISceneDelegateClassName
          test "$(plutil -extract "$scene_key" raw -o - "$APP/Info.plist")" = SDLUIKitSceneDelegate
          xcrun lipo -verify_arch arm64 "$APP/StarryLibrary"
          xcrun vtool -show-build "$APP/StarryLibrary" | tee "$RUNNER_TEMP/device-build.txt"
          grep -E '^[[:space:]]*platform[[:space:]]+IOS$' "$RUNNER_TEMP/device-build.txt"
          grep -E '^[[:space:]]*sdk[[:space:]]+18(\.|$)' "$RUNNER_TEMP/device-build.txt"
          xcrun nm "$APP/StarryLibrary" > "$RUNNER_TEMP/device-symbols.txt"
          grep -F '_OBJC_CLASS_$_SDLUIKitSceneDelegate' "$RUNNER_TEMP/device-symbols.txt"
          staging="$(mktemp -d)"
          mkdir -p "$staging/Payload" dist
          ditto "$APP" "$staging/Payload/StarryLibrary.app"
          ipa="$GITHUB_WORKSPACE/dist/Starry-Library-iOS18-unsigned.ipa"
          (cd "$staging" && /usr/bin/zip -q -r -y -X "$ipa" Payload)
          unzip -tq "$ipa"
          for path in StarryLibrary Info.plist assets/shaders/scene.frag assets/fonts/Barlow-Regular.ttf assets/popups/cohete.obj assets/covers/europa.png; do
            unzip -p "$ipa" "Payload/StarryLibrary.app/$path" | cmp - "$APP/$path"
          done

      - uses: actions/upload-artifact@v4
        if: matrix.sdk == 'iphoneos'
        with:
          name: Starry-Library-iOS18-unsigned
          path: dist/Starry-Library-iOS18-unsigned.ipa
          if-no-files-found: error

      - name: Start and exercise the app on iOS 18
        if: matrix.sdk == 'iphonesimulator'
        run: |
          set -eo pipefail
          xcrun simctl list runtimes
          phone="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices=json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if ".iOS-18-" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone 16"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("No iPhone with an iOS 18 simulator runtime")')"
          xcrun simctl bootstatus "$phone" -b
          codesign --force --sign - "$APP"
          xcrun simctl install "$phone" "$APP"
          data="$(xcrun simctl get_app_container "$phone" "$BUNDLE_ID" data)"
          xcrun simctl launch "$phone" "$BUNDLE_ID" --ipad-smoke-test
          for i in {1..60}; do
            marker="$(find "$data" -name starry-ipad-smoke.txt -type f -print -quit)"
            if [[ -n "$marker" && -s "$marker" ]]; then
              xcrun simctl io "$phone" screenshot starry-ios18-reading.png
              cat "$marker"
              grep -q '^OK:' "$marker"
              exit
            fi
            sleep 2
          done
          xcrun simctl io "$phone" screenshot starry-ios18-reading.png
          xcrun simctl spawn "$phone" log show --last 3m --predicate 'process == "StarryLibrary"' --style compact
          exit 1

      - uses: actions/upload-artifact@v4
        if: always() && matrix.sdk == 'iphonesimulator'
        with:
          name: Starry-Library-iOS18-unsigned-simulator
          path: starry-ios18-reading.png
          if-no-files-found: ignore
